name: Update school calendar

on:
  schedule:
    - cron: "17 13 * * *"   # daily, ~6am Pacific
  workflow_dispatch:         # "Run workflow" button for a manual refresh
  push:
    paths:
      - build_calendar.py

permissions:
  contents: write
  actions: write      # lets the keep-alive step reset GitHub's 60-day inactivity timer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build curated feed
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # Pages hostnames are lowercase
          repo="${GITHUB_REPOSITORY#*/}"
          export FEED_URL="https://${owner}.github.io/${repo}/school.ics"
          export REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          python build_calendar.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update school calendar"
          git push

      - name: Keep schedule alive
        # GitHub disables scheduled workflows after 60 days of repo inactivity. Re-enabling the
        # workflow on every run resets that timer, so the daily schedule never lapses.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml || echo "Could not re-enable (harmless)."
