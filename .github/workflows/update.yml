name: Update school calendar

on:
  schedule:
    - cron: "17 13 * * *"   # daily, ~6am Pacific
  workflow_dispatch:         # "Run workflow" button for a manual refresh
  push:
    paths:
      - build_calendar.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build curated feed
        env:
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/school.ics
        run: python build_calendar.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update school calendar"
          git push
